<svg width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============================================================
       MENTAHAN BACKGROUND — FIKOM PRELOVED (Auth Screens)
       Font pasangan: Poppins (fallback: Arial / Helvetica, sans-serif)

       Warna dipakai di sini:
         blue/500  #2F6FD1   (lingkaran dekor biru, opacity 0.08)
         blue/700  #1B4B8F   (lingkaran & arc dekor biru, opacity 0.08–0.18)
         red/500   #E13238   (lingkaran dekor merah, opacity 0.08–0.18)
         red/600   #C41E24   (lingkaran & arc dekor merah, opacity 0.08–0.16)
         gradient stop 1  #E8F0FC  (blue/100)
         gradient stop 2  #F7F7F9  (neutral/50, titik tengah netral)
         gradient stop 3  #FDEAEA  (red/100)
  ============================================================ -->

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F0FC"/>
      <stop offset="55%" stop-color="#F7F7F9"/>
      <stop offset="100%" stop-color="#FDEAEA"/>
    </linearGradient>
  </defs>

  <!-- base gradient -->
  <rect x="0" y="0" width="1440" height="1024" fill="url(#bgGradient)"/>

  <!-- dekorasi lingkaran brand (biru) kiri-atas -->
  <circle cx="60" cy="40" r="220" fill="#2F6FD1" opacity="0.08"/>
  <circle cx="120" cy="90" r="120" fill="#1B4B8F" opacity="0.08"/>

  <!-- dekorasi lingkaran brand (merah) kanan-bawah -->
  <circle cx="1400" cy="1000" r="240" fill="#E13238" opacity="0.08"/>
  <circle cx="1330" cy="930" r="130" fill="#C41E24" opacity="0.08"/>

  <!-- dekorasi arc ganda ala logo (kanan atas) -->
  <path d="M 1260 40 A 150 150 0 0 1 1410 190" fill="none" stroke="#1B4B8F" stroke-width="14" stroke-linecap="round" opacity="0.18"/>
  <path d="M 1300 90 A 100 100 0 0 1 1400 190" fill="none" stroke="#E13238" stroke-width="14" stroke-linecap="round" opacity="0.18"/>

  <!-- dekorasi arc ganda ala logo (kiri bawah) -->
  <path d="M 180 984 A 150 150 0 0 1 30 834" fill="none" stroke="#E13238" stroke-width="14" stroke-linecap="round" opacity="0.16"/>
  <path d="M 140 934 A 100 100 0 0 1 40 834" fill="none" stroke="#1B4B8F" stroke-width="14" stroke-linecap="round" opacity="0.16"/>

</svg>
